# Serves the Vite build and proxies /api/<service>/... to that service, stripping the
# prefix exactly like vite.config.ts does in development.
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS; resolve per request so a restarted service is found again
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 6m;

    location ~ ^/api/(placement|attendance|timetable|checkin|import)(/.*)?$ {
        set $svc $1;
        set $rest $2;
        if ($svc = placement)  { set $upstream placement-service:8081; }
        if ($svc = attendance) { set $upstream attendance-service:8082; }
        if ($svc = timetable)  { set $upstream timetable-service:8083; }
        if ($svc = checkin)    { set $upstream checkin-service:8084; }
        if ($svc = import)     { set $upstream import-service:8090; }
        if ($rest = "") { set $rest /; }
        proxy_pass http://$upstream$rest$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
