# In-memory database: ./mvnw verify needs neither MySQL nor Kafka
spring.datasource.url=jdbc:h2:mem:timetable;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# No broker in plain tests: no topics, no listener, no relay timer
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
quorum.outbox.relay.enabled=false
