spring.application.name=attendance-service
server.port=8082

# Optional local env file (KEY=value lines). Real environment variables win.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# MySQL: own database, credentials from the environment
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/quorum_attendance?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=attendance-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Values are read as plain JSON trees. A message that is not JSON becomes a
# DeserializationException that the error handler sends to <topic>.DLT.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=tools.jackson.databind.JsonNode
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# import-events also carries timetable parts of up to ~900 KB (skipped here, but still fetched)
spring.kafka.consumer.properties.max.partition.fetch.bytes=2097152

# Producer for the outbox relay (payloads are JSON strings already) and for dead letters
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.max.request.size=2097152

# Retries before a failing message goes to the DLT
quorum.kafka.retry.interval-ms=1000
quorum.kafka.retry.attempts=2

# Transactional outbox relay for od-events
quorum.outbox.relay.enabled=true
quorum.outbox.relay-interval=500ms
quorum.outbox.send-timeout=10s
quorum.outbox.batch-size=100

# Off: checkin-service turns import-events ATTENDANCE_UPLOADED into ATTENDANCE_MARKED (source FILE)
# on checkin-events, so import-events is not read here. true = the old TEMPORARY direct path
# (FileAttendanceBridge); only for running attendance-service without checkin-service.
quorum.file-attendance-bridge.enabled=false

# Zone that decides "today" for the 14-day coordinator correction window.
# Default Asia/Kolkata; override with QUORUM_TIME_ZONE.
quorum.time-zone=${QUORUM_TIME_ZONE:Asia/Kolkata}

# Store and read Instants as UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
