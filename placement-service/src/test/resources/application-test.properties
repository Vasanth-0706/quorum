# In-memory database: ./mvnw verify needs neither MySQL nor Kafka
spring.datasource.url=jdbc:h2:mem:placement;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# No broker in tests: do not create topics or run the relay on a timer
spring.kafka.admin.auto-create=false
quorum.outbox.relay.enabled=false
